name: taktile
description: >-
  Taktile is an agentic decision platform for financial institutions that
  combines AI speed with human oversight to automate and optimize high-stakes
  decisions across banking and insurance. Its Decision Engine, AI Agent Manager,
  Case Manager, and Context Layer power onboarding and KYC, credit underwriting,
  AML and fraud investigation, claims processing, and insurance underwriting.
  Teams design, test, deploy, and monitor decision flows and AI agents through a
  no-code studio backed by real-time APIs (the Taktile API and Flow API), with
  enterprise-grade infrastructure, data integrations, and governance controls.
